<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Área interna</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#17202e;--ink3:#7a869c;--line:#e3e8f0;--teal:#0f766e;--red:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#10151d;--card:#18202b;--ink:#e8edf5;--ink3:#8593a8;--line:#27313f;--teal:#2dd4bf;--red:#f97066}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
form{width:min(380px,92vw);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px}
h1{font-size:18px;margin:0 0 4px}p{color:var(--ink3);font-size:13px;margin:0 0 16px}
input,button{width:100%;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);margin-bottom:10px}
input{background:var(--bg);color:var(--ink)}button{background:var(--teal);color:#fff;border-color:var(--teal);cursor:pointer}
#msg{color:var(--red);font-size:13px;min-height:18px}
</style></head><body>
<form id="f"><h1>Área interna</h1><p>Acesso restrito à equipe autorizada.</p>
<input id="e" type="email" placeholder="E-mail" autocomplete="username" required><input id="s" type="password" placeholder="Senha" autocomplete="current-password" required>
<button id="b" type="submit">Entrar</button><div id="msg"></div></form>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
var sb=null,msg=document.getElementById('msg');
function say(t){msg.textContent=t||''}
function enter(token){
  try{sessionStorage.setItem('sm_int_token',token)}catch(e){}
  return fetch('/api/interno/ui',{headers:{Authorization:'Bearer '+token}}).then(function(r){
    if(r.status===403){return sb.auth.signOut().then(function(){try{sessionStorage.removeItem('sm_int_token')}catch(e){};say('Esta conta não tem acesso à área interna.');throw new Error('x')})}
    if(!r.ok){throw new Error('Não foi possível abrir a área interna agora.')}
    return r.text();
  }).then(function(html){document.open();document.write(html);document.close()});
}
fetch('/api/config').then(function(r){return r.json()}).then(function(cfg){
  sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  var q=location.search;
  if(/logout=1/.test(q)){return sb.auth.signOut().then(function(){history.replaceState(null,'','/interno/')})}
  return sb.auth.getSession().then(function(d){var s=d.data&&d.data.session;if(s&&s.access_token)return enter(s.access_token).catch(function(e){if(e.message!=='x')say(e.message)})});
}).catch(function(){say('Serviço indisponível. Tente novamente em instantes.')});
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();say('');var b=document.getElementById('b');b.disabled=true;
  if(!sb){say('Serviço indisponível.');b.disabled=false;return}
  sb.auth.signInWithPassword({email:document.getElementById('e').value.trim(),password:document.getElementById('s').value}).then(function(r){
    if(r.error||!r.data||!r.data.session){say('E-mail ou senha inválidos.');b.disabled=false;return}
    return enter(r.data.session.access_token).catch(function(e){if(e.message!=='x')say(e.message);b.disabled=false});
  });
});
})();
</script></body></html>
