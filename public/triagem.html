<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diagnóstico grátis — SM Financial</title>
<meta name="description" content="Responda 1 pergunta rápida e descubra por onde começar a organizar seu dinheiro. Grátis, sem cartão.">
<meta name="theme-color" content="#16324F">
<meta property="og:title" content="Descubra por onde começar a organizar seu dinheiro">
<meta property="og:description" content="1 pergunta rápida. Grátis, sem cartão. Do aperto ao plano, do plano ao alívio.">
<link rel="icon" href="/icons/icon-192.png">
<style>
:root{--navy:#16324F;--navy2:#1F4E79;--gold:#AD8A2A;--gold-l:#D4AF4F;--ink:#101B2D;--ink2:#4A5668;--ink3:#8A94A6;--line:#E3E8EF;--bg:#F6F8FB;--card:#fff}
*{box-sizing:border-box;margin:0}
html{color-scheme:light}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:28px 18px calc(28px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;color:var(--navy);letter-spacing:.01em}
.brand i{display:block;width:30px;height:6px;border-radius:3px;background:var(--gold-l)}
.kicker{margin-top:22px;font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--navy2)}
h1{margin-top:10px;text-align:center;font-size:clamp(26px,7.4vw,34px);line-height:1.15;font-weight:800;letter-spacing:-.02em;max-width:460px}
.sub{margin-top:12px;text-align:center;color:var(--ink2);font-size:16.5px;line-height:1.5;max-width:420px}
.card{margin-top:24px;width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 28px rgba(16,27,45,.07);padding:22px 20px 24px}
.bar{height:6px;border-radius:3px;background:#EEF1F5;overflow:hidden}
.bar b{display:block;height:100%;width:20%;border-radius:3px;background:linear-gradient(90deg,var(--navy2),var(--gold-l));transition:width .35s ease}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--ink3)}
.back{background:none;border:0;color:var(--navy2);font:inherit;font-weight:600;cursor:pointer;padding:6px 4px;min-height:36px}
.back[hidden]{display:block;visibility:hidden}
h2{margin-top:14px;font-size:23px;line-height:1.22;font-weight:800;letter-spacing:-.01em}
.opts{display:grid;gap:11px;margin-top:20px}
.opt{width:100%;text-align:left;font:inherit;font-size:17px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:17px 18px;min-height:56px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:var(--navy2);background:#F3F7FB}
.opt:active{transform:scale(.99)}
.opt:focus-visible,.back:focus-visible,.cta:focus-visible,.alt:focus-visible{outline:3px solid var(--gold-l);outline-offset:2px}
.opt.sel{border-color:var(--navy);background:#E9F0F7}
.res-tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:20px}
.t-alto{background:#FCE8E6;color:#9B2C22}.t-medio{background:#FBF1D6;color:#7A5A0E}.t-ok{background:#DDF3E8;color:#0B6B47}
.res h2{margin-top:14px;font-size:25px}
.res p{margin-top:12px;color:var(--ink2);font-size:16.5px;line-height:1.55}
.steps{margin-top:18px;display:grid;gap:10px;list-style:none;padding:0}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.45}
.steps li span{flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.cta{display:block;width:100%;text-align:center;text-decoration:none;margin-top:22px;background:var(--gold-l);color:#0D1F33;font-weight:800;font-size:18px;padding:18px 20px;border-radius:16px;box-shadow:0 4px 0 #A98B35;transition:transform .1s}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 #A98B35}
.alt{display:block;text-align:center;margin-top:14px;color:var(--navy2);font-weight:700;font-size:16px;text-decoration:none;padding:10px}
.nt{font-weight:700;font-size:16px;margin-bottom:10px}.ou{font-size:13px;opacity:.8;margin:0 0 12px}.nf{margin-top:20px;padding:14px;border-radius:14px;background:rgba(255,255,255,.06);text-align:left}.nf label{display:block;font-size:14px;margin-bottom:8px}.nf input[type=email],.nf input[type=text]{margin-bottom:10px;width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #8A94A6;font-size:16px}.nf .nc{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;margin:10px 0}.nf .nb{width:100%;padding:12px;border-radius:10px;border:0;background:#16324F;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.nm{margin-top:8px;font-size:13px}.nm.ok{font-weight:700}
.note{margin-top:14px;text-align:center;font-size:12.5px;color:var(--ink3);line-height:1.5}
.price{margin-top:16px;text-align:center;font-size:14px;color:var(--ink3)}
.slogan{margin-top:22px;text-align:center;font-weight:700;color:var(--gold);font-size:15px;max-width:380px;line-height:1.4}
footer{margin-top:14px;font-size:12px;color:var(--ink3);text-align:center}
footer a{color:var(--ink3)}
.fade{animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar b,.opt{transition:none}}
</style>
</head>
<body>
<div class="brand"><i></i>SM Financial</div>
<div class="kicker">Diagnóstico grátis</div>
<h1 id="h1">Descubra por onde começar a organizar seu dinheiro</h1>
<p class="sub" id="sub">1 pergunta rápida. Sem cadastro e sem cartão.</p>

<main class="card" id="card" aria-live="polite"></main>

<div class="slogan">Do aperto ao plano, do plano ao alívio.</div>
<footer>@smfinancialcorporate.oficial · <a href="/termos.html">Termos</a> · <a href="/privacidade.html">Privacidade</a></footer>

<script>
(function () {
  var Q = [
    { k: 'mes', t: 'Como o seu mês termina hoje?', o: ['Sobra um pouco', 'Fecha raspando', 'Falta dinheiro antes do fim', 'Já estou no vermelho'] }
  ];
  var i = 0, ans = {}, cfg = {};
  var card = document.getElementById('card'), h1 = document.getElementById('h1'), sub = document.getElementById('sub');
  fetch('/api/config').then(function (r) { return r.ok ? r.json() : {}; }).then(function (c) { cfg = c || {}; }).catch(function () {});

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function ask() {
    var q = Q[i];
    card.className = 'card fade';
    card.innerHTML = '<h2>' + esc(q.t) + '</h2><div class="opts">' +
      q.o.map(function (o, n) { return '<button class="opt' + (ans[q.k] === n ? ' sel' : '') + '" data-n="' + n + '">' + esc(o) + '</button>'; }).join('') + '</div>';
    card.querySelectorAll('.opt').forEach(function (b) {
      b.addEventListener('click', function () {
        ans[q.k] = +b.dataset.n; b.classList.add('sel');
        setTimeout(function () { if (i < Q.length - 1) { i++; ask(); } else { result(); } }, 160);
      });
    });
  }

  // Nível de aperto: quanto mais sinais de pressão, mais alto
  // Nível de aperto pela única pergunta: como o mês termina
  function nivel() { return ans.mes >= 2 ? 'alto' : ans.mes === 1 ? 'medio' : 'ok'; }

  // Só a origem vai na URL (para medir quantos vêm da triagem). As respostas nunca saem do aparelho.
  function qs() { return 'src=triagem'; }

  function result() {
    var n = nivel(), T = {
      alto: { tag: 'Prioridade: aliviar o aperto', cls: 't-alto', h: 'Dá pra respirar. Vamos começar pelo que mais pesa.', p: 'Pelo que você respondeu, o mês está apertado e as dívidas pedem atenção. O melhor primeiro passo é enxergar tudo em um lugar só e montar um plano, na ordem certa.', steps: ['Coloque o que você ganha e o que deve em um só lugar.', 'Veja o que dá pra cortar e o que vale negociar primeiro.', 'Siga um plano passo a passo, um mês de cada vez.'] },
      medio: { tag: 'Prioridade: ganhar controle', cls: 't-medio', h: 'Você está perto de virar o jogo.', p: 'Seu mês fecha no limite. Com os números organizados, fica fácil achar de onde sai a folga e evitar que o aperto vire dívida.', steps: ['Registre seus gastos sem esforço.', 'Descubra para onde vai o dinheiro de verdade.', 'Defina uma meta pequena e acompanhe.'] },
      ok: { tag: 'Prioridade: fazer o dinheiro render', cls: 't-ok', h: 'Você está bem. Agora é hora de ir além.', p: 'Seu mês fecha no azul. O próximo passo é dar destino a essa sobra e criar metas, para o dinheiro trabalhar a seu favor.', steps: ['Organize tudo para não perder o controle.', 'Crie metas e acompanhe o progresso.', 'Planeje os próximos meses com calma.'] }
    }[n];
    var app = '/?cadastro=1&' + qs();   // vai direto para a tela de criar conta
    var paid = cfg.hotmartCheckoutTrial ? cfg.hotmartCheckoutTrial + (cfg.hotmartCheckoutTrial.indexOf('?') >= 0 ? '&' : '?') + qs() : null;
    // A oferta fica no próprio resultado (sem a etapa extra /apresentacao): principal = plano de entrada; alternativa = entrar grátis.
    var primary = paid ? ['Quero começar por R$ 5,00/semana', paid] : ['Entrar grátis no aplicativo', app];
    var second = paid ? ['Prefiro entrar grátis, com limites', app] : null;
    h1.textContent = 'Seu diagnóstico está pronto'; sub.textContent = 'Com base na sua resposta.';
    card.className = 'card res fade';
    card.innerHTML =
      '<span class="res-tag ' + T.cls + '">' + esc(T.tag) + '</span><h2>' + esc(T.h) + '</h2><p>' + esc(T.p) + '</p>' +
      '<ul class="steps">' + T.steps.map(function (s, k) { return '<li><span>' + (k + 1) + '</span><div>' + esc(s) + '</div></li>'; }).join('') + '</ul>' +
      (paid ? '<p class="price">Plano de entrada: R$ 5,00 por semana. Sem fidelidade. Cancele quando quiser.</p>' : '') + '<a class="cta" id="cta" href="' + esc(primary[1]) + '">' + esc(primary[0]) + '</a>' +
      (second ? '<a class="alt" id="alt" href="' + esc(second[1]) + '">' + esc(second[0]) + '</a>' : '') +
      '<div class="nf" id="teste"><div class="nt">Prefere que a gente chame você para testar grátis?</div>' +
      '<div class="ou">Deixe seu contato e falamos com você.</div>' +
      '<form id="nf"><label for="ne">Seu e-mail</label><input id="ne" type="email" autocomplete="email" placeholder="seu@email.com" maxlength="160">' +
      '<label for="ni">Seu @ do Instagram (opcional)</label><input id="ni" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="@seuperfil" maxlength="31">' +
      '<label class="nc"><input type="checkbox" id="nt" checked> Quero o teste grátis: autorizo o SM Financial a me contatar por e-mail (e pelo Instagram, se informei o @).</label>' +
      '<label class="nc"><input type="checkbox" id="nk"> Também quero receber 3 e-mails com dicas. Posso sair a qualquer momento.</label>' +
      '<button type="submit" class="nb">Enviar meu contato</button><div id="nm" class="nm" role="status"></div></form></div>' +
      '<div class="note">Suas respostas do diagnóstico ficam só neste aparelho. E-mail e @ são usados só para o que você marcou. Você pode pedir para apagar quando quiser.</div>';
    var nf = document.getElementById('nf');
    if (nf) nf.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var nm = document.getElementById('nm'), em = document.getElementById('ne').value.trim(), ig = document.getElementById('ni').value.trim().replace(/^@+/, ''), teste = document.getElementById('nt').checked, dicas = document.getElementById('nk').checked;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) { nm.textContent = 'Preencha um e-mail válido.'; return; }
      if (ig && !/^[A-Za-z0-9._]{1,30}$/.test(ig)) { nm.textContent = 'O @ do Instagram só tem letras, números, ponto e sublinhado.'; return; }
      if (!teste && !dicas) { nm.textContent = 'Marque pelo menos uma opção: teste grátis ou dicas por e-mail.'; return; }
      var st = (window.smFunil && smFunil.state()) || {}, base = { email: em, consentimento: true, visitor: st.visitor || null, campanha: st.campanha || null };
      var post = function (url, body) { return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { if (!r.ok) throw 0; }); };
      var jobs = [];
      if (teste) jobs.push(post('/api/funil/interesse', Object.assign({ instagram: ig || null, nivel: nivel() }, base)));
      if (dicas) jobs.push(post('/api/funil/inscrever', base));
      Promise.all(jobs).then(function () {
        nf.innerHTML = '<div class="nm ok">' + (teste ? 'Pronto! Recebemos seu contato e vamos chamar você para o teste grátis.' : '') + (dicas ? ' Para as dicas, enviamos um e-mail de confirmação: clique no link dele (se não chegar, olhe o spam).' : '') + ' Se preferir não esperar, crie sua conta grátis agora no botão acima.</div>';
      }).catch(function () { nm.textContent = 'Não foi possível agora. Tente de novo em instantes.'; });
    });
    try { if (window.smFunil) smFunil.track('triagem_fim'); } catch (e) {}
    var c = document.getElementById('cta'); if (c) c.focus({ preventScroll: true });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  ask();
})();
</script>
<script src="/funil.js"></script>
</body>
</html>
